<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCF</title><link id="bs-rtl" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link id="bs-ltr" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><div id="nav"></div>
<main class="container py-4" style="max-width:820px" id="a"></main>
<div id="foot"></div><script src="js/bootstrap.bundle.min.js"></script></body></html><script>window.page=function(){
var id=+new URLSearchParams(location.search).get('id')||1,i=D.filter(function(x){return x.id==id})[0]||D[0],other=LANG=='ar'?'en':'ar',show=LANG,key='cm'+i.id;
var cm=[];try{cm=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
var u=encodeURIComponent(location.href);
function draw(){var txt=i.tx[show]||i.tx[other],has=i.langs.length>1;
$('#a').innerHTML='<a href="archive.html" class="btn btn-sm btn-outline-ocf mb-3">'+t('archive')+'</a><h1 class="h2" style="color:var(--g1)">'+(i.ti[show]||i.ti[other])+'</h1><p class="text-muted"><span class="badge badge-t">'+t('t'+i.type)+'</span>'+fd(i.date)+'</p>'+
(i.video?'<video controls class="rounded mb-3" poster="https://picsum.photos/seed/'+i.img+'/800/500"><source src="'+i.video+'"></video>':'<img class="img-fluid rounded mb-3" src="https://picsum.photos/seed/'+i.img+'/800/500" alt="">')+
'<div dir="'+(show=='ar'?'rtl':'ltr')+'" class="bg-white p-3 rounded mb-3">'+txt+'</div>'+
(has?'<button id="tr" class="btn btn-sm btn-outline-ocf mb-3">'+(show==LANG?t('trans'):t('orig'))+'</button>':'')+
'<div class="mb-4"><strong>'+t('share')+':</strong> <a class="btn btn-sm btn-ocf" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u='+u+'">Facebook</a> <a class="btn btn-sm btn-ocf" target="_blank" href="https://twitter.com/intent/tweet?url='+u+'">X</a> <a class="btn btn-sm btn-ocf" target="_blank" href="https://wa.me/?text='+u+'">WhatsApp</a> <button id="cp" class="btn btn-sm btn-outline-ocf">'+t('copy')+'</button></div>'+
'<h2 class="sec">'+t('comments')+'</h2><div id="cl">'+(cm.length?cm.map(function(c){return '<div class="cmt"><strong>'+c.n+'</strong><p class="mb-0">'+c.m+'</p></div>'}).join(''):'<p class="text-muted">'+t('nocmt')+'</p>')+'</div>'+
'<div class="mt-3"><input id="cn" class="form-control mb-2" placeholder="'+t('name')+'"><textarea id="cmsg" class="form-control mb-2" rows="3" placeholder="'+t('comments')+'"></textarea><button id="pc" class="btn btn-ocf">'+t('post')+'</button></div>';
if(has)$('#tr').onclick=function(){show=show==LANG?other:LANG;draw()};
$('#cp').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent=t('copied')};
$('#pc').onclick=function(){var n=$('#cn').value.trim(),m=$('#cmsg').value.trim();if(!n||!m)return;
cm.push({n:n.replace(/</g,'&lt;'),m:m.replace(/</g,'&lt;')});try{localStorage.setItem(key,JSON.stringify(cm))}catch(e){}draw()}}
draw()}</script>
