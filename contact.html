<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCF</title><link id="bs-rtl" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link id="bs-ltr" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><div id="nav"></div>
<main class="container py-4"><h2 class="sec" data-i18n="contactT"></h2><div class="row g-4">
<div class="col-md-7"><form id="cf" class="bg-white p-4 rounded shadow-sm needs-validation" novalidate>
<div class="mb-3"><label class="form-label" data-i18n="name"></label><input class="form-control" required></div>
<div class="mb-3"><label class="form-label" data-i18n="email"></label><input type="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label" data-i18n="subject"></label><input class="form-control" required></div>
<div class="mb-3"><label class="form-label" data-i18n="msg"></label><textarea rows="5" class="form-control" required></textarea></div>
<button class="btn btn-ocf" data-i18n="send"></button><div id="ok" class="alert alert-success mt-3 d-none"></div></form></div>
<div class="col-md-5"><div class="bg-white p-4 rounded shadow-sm"><h3 class="h5" style="color:var(--g1)" data-i18n="info"></h3>
<p>📧 info@example.org</p><p>📞 +000 000 0000</p><p data-i18n="addr"></p><p>🔗 <a id="fbl" target="_blank" rel="noopener" data-i18n="fb"></a></p></div></div></div></main>
<div id="foot"></div><script src="js/bootstrap.bundle.min.js"></script></body></html><script>window.page=function(){$('#fbl').href=FB;
$('#cf').onsubmit=function(e){e.preventDefault();this.classList.add('was-validated');if(!this.checkValidity())return;
$('#ok').textContent=t('sent');$('#ok').classList.remove('d-none');this.reset();this.classList.remove('was-validated')}}</script>
